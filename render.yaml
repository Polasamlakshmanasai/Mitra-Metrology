# render.yaml — Render Blueprint for Mitra Metrology
# Deploy both services from a single GitHub repository.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─────────────────────────────────────────────
  # BACKEND — FastAPI (Docker, monorepo root context)
  # ─────────────────────────────────────────────
  - type: web
    name: mitra-metrology-api
    runtime: docker
    # Docker build context is the repo ROOT so ai_engine/ and rules/ are accessible.
    # The Dockerfile lives at backend/Dockerfile.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a strong random value
      - key: PORT
        value: "8000"

  # ─────────────────────────────────────────────
  # FRONTEND — React/Vite (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: mitra-metrology-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      # Set this to your deployed backend URL after the API service is up.
      # Example: https://mitra-metrology-api.onrender.com
      - key: VITE_API_URL
        value: "https://mitra-metrology-api.onrender.com"
    routes:
      # SPA fallback — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
