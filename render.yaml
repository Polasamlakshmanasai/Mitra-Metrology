# render.yaml
# Mitra Metrology - Render Blueprint
# Deploys both Backend (FastAPI) and Frontend (React/Vite)

services:

  # ==========================================
  # BACKEND - FastAPI + Docker + Tesseract
  # ==========================================
  - type: web
    name: mitra-metrology-api
    runtime: docker

    # Dockerfile is inside backend/
    dockerfilePath: ./backend/Dockerfile

    # Build from repository root because
    # ai_engine/ and rules/ are outside backend/
    dockerContext: .

    plan: free

    envVars:
      # Render automatically generates a secure value
      - key: SECRET_KEY
        generateValue: true

      # Add the Vercel frontend URL later
      - key: FRONTEND_URL
        sync: false


  # ==========================================
  # FRONTEND - React + Vite
  # ==========================================
  - type: web
    name: mitra-metrology-frontend
    runtime: static

    # Frontend is inside frontend/
    rootDir: frontend

    # Build React/Vite application
    buildCommand: npm install && npm run build

    # Vite production output
    staticPublishPath: dist

    plan: free

    envVars:
      # Backend API URL
      - key: VITE_API_URL
        value: https://mitra-metrology-api.onrender.com

    # React SPA routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html